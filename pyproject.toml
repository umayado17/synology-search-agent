# PyPI package for the agent side: nas-search (CLI) and nas-search-mcp (MCP server).
# The NAS side (unisearch) is not in this package; it is copied to the NAS by hand.
# The files stay in clients/ (single source); they are mapped into the package at build time.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nas-search-mcp"
dynamic = ["version"]
description = "MCP server and CLI to search a Synology NAS's Universal Search index over SSH. No sudo, keeps DSM 2FA, read-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "umayado17" }]
keywords = ["synology", "nas", "mcp", "universal-search", "full-text-search", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving",
]

[project.urls]
Homepage = "https://github.com/umayado17/synology-search-agent"
Changelog = "https://github.com/umayado17/synology-search-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/umayado17/synology-search-agent/issues"

[project.scripts]
nas-search = "nas_search_mcp.nas_search:main"
nas-search-mcp = "nas_search_mcp.server:main"

[tool.hatch.version]
path = "clients/nas-search-mcp"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"packaging/__init__.py" = "nas_search_mcp/__init__.py"
"clients/nas-search" = "nas_search_mcp/nas_search.py"
"clients/nas-search-mcp" = "nas_search_mcp/server.py"

[tool.hatch.build.targets.sdist]
only-include = ["clients", "packaging", "README.md", "LICENSE", "pyproject.toml"]
